name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.1)'
        required: false
        default: '1.0'
      version_code:
        description: 'Version code (integer, increment each release)'
        required: false
        default: '1'

jobs:
  build-aab:
    name: Build Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install Node dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor assets into Android project
        run: npx cap sync android

      - name: Set version from tag or input
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == v* ]]; then
            VERSION_NAME="${TAG#v}"
          else
            VERSION_NAME="${{ github.event.inputs.version_name || '1.0' }}"
          fi
          VERSION_CODE="${{ github.event.inputs.version_code || '1' }}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Building v$VERSION_NAME ($VERSION_CODE)"

      - name: Patch version in build.gradle
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ env.VERSION_CODE }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ env.VERSION_NAME }}\"/" android/app/build.gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Rename AAB
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/bundle/release/app-release.aab \
             release-output/redlineiq-${{ env.VERSION_NAME }}.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: redlineiq-${{ env.VERSION_NAME }}-aab
          path: release-output/redlineiq-${{ env.VERSION_NAME }}.aab
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/redlineiq-${{ env.VERSION_NAME }}.aab
          name: RedlineIQ ${{ env.VERSION_NAME }}
          draft: false
          prerelease: false
